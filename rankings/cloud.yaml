      model: google/gemma-4-31b-it:free
      arena_elo: 1451
      context_window: 262144
      source: "lmmarketcap.com/benchmarks/arena_elo — 2026-06"
    # NOTE: thinkingmachines/inkling:free removed 2026-08-27 — now 403s
    #   ("only available on agentic harnesses"), not usable as a plain
    #   chat-completion model. z-ai/glm-5.2:free (used as its replacement in
    #   `reasoning`) was deliberately NOT reused here: its <think>-block
    #   behavior isn't verified and this category excludes anything with a
    #   reasoning trace. No replacement added — gemma-4-31b-it:free above and
    #   Gemini below still cover this category.
    # ── Gemini (independent 4th free provider, added 2026-08-24) ───────────
    - provider: gemini
      model: gemini-3.1-flash-lite
      note: "Fills the gap noted above — Groq has no non-reasoning instruct model free right now. Flash-Lite is not a CoT/reasoning model, safe for low-max_tokens instruction-following. Independent 4th provider (own quota/infra) for cascade resilience after the 2026-08-24 incident where Groq/NVIDIA/OpenRouter all failed at once. No card required."
