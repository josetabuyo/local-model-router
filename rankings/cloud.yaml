# Cloud model rankings — external public benchmarks only
# No live benchmark calls (quota protection policy)
# Sources:
#   arena_elo — lmmarketcap.com/benchmarks/arena_elo (2026-06-29)
#   groq scores — console.groq.com model pages (2026-06)
#   openrouter — openrouter.ai/models (2026-06-29)
# slot 0 = best for category; cascade order: NVIDIA NIM → Groq → OpenRouter
#
# Rate limits (free tier):
#   NVIDIA NIM:   40 RPM global, 1 000 credits on signup — build.nvidia.com
#   Groq:         30 RPM / 1 000 RPD / 8 K TPM per model
#   OpenRouter:   20 RPM / 200 RPD per model
#
# Auth env vars: NVIDIA_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY
# NOTE: Groq llama-3.3-70b-versatile deprecated 2026-06-29, decommissioned 2026-08-16
# NOTE: z-ai/glm-5.2 added 2026-07-19 — successor to glm-5.1 (EOL 2026-07-02),
#   free on NVIDIA NIM since 2026-07-02. 753B MoE, 1M context, top open-weight
#   coding model (SWE-bench Pro 62.1, Terminal-Bench 2.1 81.0). MIT license.
#   Source: docs.api.nvidia.com/nim/reference/z-ai-glm-5.2 — 2026-07
# NOTE 2026-07-21: OpenRouter free-tier catalog rotated — verified live against
#   GET https://openrouter.ai/api/v1/models (no key required, filtered to
#   id.endswith(':free')). Three slugs used below had gone paid-only and were
#   404ing every cascade call: qwen/qwen3-next-80b-a3b-instruct:free,
#   openai/gpt-oss-120b:free, meta-llama/llama-3.3-70b-instruct:free. Replaced
#   with currently-free slugs from that same live listing (google/gemma-4-*:free
#   and nvidia/nemotron-3-super-120b-a12b:free were re-checked and are still
#   live, unchanged). New slots have no arena_elo — these models aren't on
#   lmmarketcap yet — so they carry a plain descriptive note instead of a
#   fabricated score.
# WATCH: Kimi K3 (2.8T, released 2026-07-16, #3 on Artificial Analysis) is
#   paid-only so far (OpenRouter moonshotai/kimi-k3, $3/$15 per Mtok). Weights
#   due ~2026-07-27 — recheck build.nvidia.com then for a free NIM listing.
#   Microsoft MAI-Thinking-1/MAI-Code-1 (Build 2026) have no free tier and are
#   not on NVIDIA NIM — skip until a free/cheap provider picks them up.
# EVALUATED 2026-07-23 (OpenRouter "task-aware routing" email, mid-July 2026
#   changelog) — none of these fit the free-tier cascade policy, not added:
#   - openrouter/auto-beta: meta-router, $0 routing fee but bills at the
#     underlying model's rate (i.e. not itself free) and picks the model
#     black-box per request. Conflicts with this project's design (we own
#     the ranking/cascade logic in this file); skip.
#   - moonshotai/kimi-k3: confirmed paid-only, $3/$15 per Mtok, no free
#     hosted route yet. Same conclusion as the note above — still watching
#     for a free NIM listing after weights drop.
#   - kwaipilot/kat-coder-air-v2.5 (and -pro-v2.5): cheap but not free —
#     $0.15/$0.60 per Mtok, 256K context. Good agentic-coding scores but no
#     ":free" OpenRouter slug exists; recheck if one appears.
# NOTE 2026-07-23: OpenRouter free catalog re-scanned live (curl .../api/v1/models,
#   filtered ':free', 15 hits). Two new adds: poolside/laguna-s-2.1:free (coding,
#   coding/code_debug — 118B-A8B, SWE-Bench Multilingual 78.5, strong agentic
#   coding for its size) and inclusionai/ling-3.0-flash:free (reasoning/
#   instruction — 124B-A5.1B, ~Sonnet-4.6 class). Ling-3.0-flash is a TIME-
#   LIMITED launch promo, free only through 2026-08-03 — recheck
#   openrouter.ai/api/v1/models around then and drop/replace it if it goes paid.
#   Also live but not added (off-category or redundant): poolside/laguna-xs-2.1
#   and laguna-m.1 (smaller Laguna variants, no clear category gap yet),
#   nvidia/nemotron-3.5-content-safety:free (classifier, not general chat),
#   nvidia/nemotron-nano-12b-v2-vl:free (vision-language, no vision category
#   here), nvidia/nemotron-nano-9b-v2:free (small/fast, no speed-ranked
#   category besides multilingual which is already Groq-first).
# NOTE 2026-07-27: Added `cheapest:<category>` and `fastest:<category>` as
#   model-string modes alongside `best:<category>` (see router/registry.py).
#   `cheapest` keeps free-tier entries first (in curated order) then appends
#   any `paid: true` entries sorted ascending by blended $/Mtok — free entries
#   are always tried first, paid ones are a last resort. `fastest` reorders
#   free-tier entries only by provider speed (Groq > NVIDIA NIM > OpenRouter),
#   with per-model overrides where we have documented real numbers. Paid
#   entries are excluded from `best:`/hybrid cascades automatically via the
#   `paid: true` flag — they only ever surface through `cheapest:`.
#   This is what finally puts the two paid coding models evaluated above to
#   use: kwaipilot/kat-coder-air-v2.5 ($0.15/$0.60, cheapest paid rung) and
#   moonshotai/kimi-k3 ($3/$15, priciest/last rung) are now in `coding` and
#   `code_debug` as `paid: true` fallback entries — reachable only via
#   `cheapest:coding` / `cheapest:code_debug` once every free option fails.

