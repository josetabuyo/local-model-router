  instruction:
    # Reasoning models (qwen3.6-27b, kimi-k2.6, gpt-oss-120b) excluded:
    # their <think> blocks consume the entire token budget on low max_tokens
    # requests (e.g. single-word classifiers). Router now strips <think> blocks
    # before the empty-content check, but best to keep reasoning models out of
    # this category altogether. Use best:reasoning for tasks that want CoT.
    # NOTE: thinkingmachines/inkling reached EOL on NVIDIA NIM 2026-08-25
    #   (410 "reached its end of life"), removed 2026-08-27, no replacement.
    # NOTE: meta/muse-glimmer-30b removed 2026-08-29 — hangs indefinitely on
    #   NVIDIA NIM (connects, never returns, confirmed across 3 probes up to
    #   240s max-time). It was this category's ONLY NVIDIA entry and, worse,
    #   the FIRST entry tried under `best:instruction` — every call would
    #   have eaten a full 120s NVIDIA timeout before falling back. GAP: no
    #   NVIDIA entry remains in this category; gemma-4-31b-it:free
    #   (OpenRouter) and Gemini below still cover it. Recheck in a future
    #   audit for a non-reasoning NVIDIA replacement.
    # NOTE: llama/llama-4-scout-17b-16e-instruct reached EOL on Groq (404,
    #   fully gone from the catalog, not just renamed) — removed 2026-08-24.
    #   Groq gap CLOSED 2026-09-01: qwen/qwen3.8-27b appeared on Groq's
    #   catalog (new, not present as of the 2026-08-31 audit) and verified
    #   non-reasoning — see entry and note below.
    # ── Groq ───────────────────────────────────────────────────────────────
    - provider: groq
      model: qwen/qwen3.8-27b
      note: "Fills the Groq gap in this category, open since llama-4-scout-17b-16e-instruct's EOL on 2026-08-24. New model on Groq's catalog as of this audit (not present 2026-08-31), successor to qwen3.6-27b. Verified non-reasoning: two live probes (plain prompt, and a 5-max_tokens classifier-style prompt) returned direct content with no <think> block or reasoning_content field and no length-cutoff-on-empty-content — unlike qwen3.6-27b, which does emit reasoning traces and stays excluded from this category by the rule above."
      source: "own live probe against api.groq.com/openai/v1/chat/completions — verified 2026-09-01; huggingface.co/Qwen/Qwen3.8-27B (released 2026-08-14, Apache 2.0), artificialanalysis.ai/models/qwen3-8-27b (Intelligence Index 52, SWE-bench Pro 61.7)"
    # ── OpenRouter (free tier) ─────────────────────────────────────────────
    # NOTE: inclusionai/ling-3.0-flash:free removed — TIME-LIMITED PROMO ended
    #   2026-08-03 as this file warned, confirmed gone from live free catalog
