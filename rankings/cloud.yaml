  reasoning:
    # ── NVIDIA NIM ─────────────────────────────────────────────────────────
    # NOTE: z-ai/glm-5.1 reached EOL 2026-07-02, removed.
    - provider: nvidia
      model: deepseek-ai/deepseek-v4-pro
      arena_elo: 1370
