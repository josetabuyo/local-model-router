      note: "Benchmarked 2026-10-01 (thinking ON by default, 6.6 GB). Correct sieve. 1249 output tokens with reasoning trace; qwen2.5-coder:7b does it in 11s. Daily driver for interactive use since 2026-08-12, but NOT a cascade pick on wall clock until re-run with think=false."

