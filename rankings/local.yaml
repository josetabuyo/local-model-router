# Local model rankings — own benchmark runs 2026-06-20 (qwen2.5/deepseek), 2026-07-27
# (qwen2.5-coder) and 2026-10-01 (qwen3.5:9b, Ollama 0.35.0, default thinking ON).
# Sources: results/benchmark_20260620_101129.json, results/benchmark_20261001_091330.json
# Slot 0 = best for that category (used by best:<category>)
# Models not ranked top in any category can be removed from Ollama to free disk space.

categories:

  reasoning:
    - model: qwen2.5:7b
      tokens_per_sec: 17.97
      wall_clock_s: 19.4
      note: "Correct and fast. deepseek is marginally faster in tok/s but produces 3000+ CoT tokens = 164s wall clock."
    - model: deepseek-r1:8b
      tokens_per_sec: 18.85
      wall_clock_s: 164.6
      note: "Chain-of-thought inflates total time massively for simple tasks."
    - model: qwen2.5:14b
      tokens_per_sec: 4.61
      wall_clock_s: 60.0
      note: "Slow, not competitive. Removed from Ollama 2026-06-21."
    - model: qwen3.5:9b
      tokens_per_sec: 16.02
      wall_clock_s: 115.8
      note: "Benchmarked 2026-10-01 (thinking ON by default, 6.6 GB). Correct, but thinking-on output is 1855 tokens — 6x the wall clock of qwen2.5:7b for the same task. Daily driver for interactive use since 2026-08-12, but NOT a cascade pick on wall clock until re-run with think=false."

  coding:
    - model: qwen2.5-coder:7b
      tokens_per_sec: 15.9
      wall_clock_s: 10.9
      note: "Added 2026-07-27. Code-specialized fine-tune of qwen2.5:7b, same 4.7GB footprint — fits the same 16GB M1 Pro headroom with no cost. Tied on speed with plain qwen2.5:7b once warm (both ~9-11s on this harness's task); wins on published HumanEval (high-70s vs plain qwen2.5's mid-70s) for the same resource cost, so it's the better default for coding-shaped prompts."
    - model: qwen2.5:7b
      tokens_per_sec: 24.05
      wall_clock_s: 4.0
      note: "General-purpose, not code-specialized. Kept as a close second — near-identical speed to qwen2.5-coder:7b, fine for quick non-code-heavy tasks."
    - model: deepseek-r1:8b
      tokens_per_sec: 21.68
      wall_clock_s: 41.8
      note: "Verbose CoT inflates response time."
    - model: qwen2.5:14b
      tokens_per_sec: 8.76
      wall_clock_s: 12.2
      note: "Removed 2026-06-21."
    - model: qwen3.5:9b
      tokens_per_sec: 18.27
