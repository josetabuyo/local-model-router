# Local model rankings — own benchmark runs on this Mac (Apple Silicon, 16 GB).
# 2026-06-20: qwen2.5:7b / deepseek-r1:8b / qwen2.5:14b (results/benchmark_20260620_101129.json)
# 2026-07-27: qwen2.5-coder:7b
# 2026-10-01: qwen3.5:9b with thinking ON  (results/benchmark_20261001_091330.json)
# 2026-10-02: qwen3.5:9b --no-think and qwen2.5:7b re-run, Ollama 0.35.0
#             (results/benchmark_20261002_073827.json, results/benchmark_20261002_074030.json)
# `think: false` on an entry means the number was measured with thinking off; the router
# sends think=false to Ollama by default (OLLAMA_THINK), so that is the number that applies.
# qwen2.5:14b entries removed 2026-10-02 — uninstalled since 2026-06-21, the cascade kept trying it.
# Slot 0 = best for that category (used by best:<category>)
# Models not ranked top in any category can be removed from Ollama to free disk space.

categories:

  reasoning:
  - model: qwen2.5:7b
    tokens_per_sec: 18.74
    wall_clock_s: 16.0
    note: "Correct and fast. deepseek is marginally faster in tok/s but produces 3000+ CoT tokens = 164s wall clock. Re-measured 2026-10-02 on Ollama 0.35 (300 tok)."
  - model: qwen3.5:9b
    tokens_per_sec: 11.79
    wall_clock_s: 25.4
    think: false
    note: "2026-10-02, think=false (the router's default since 2026-10-02): correct, 300 tok. With thinking ON (2026-10-01) the same task took 116s/1855 tok. 6.6 GB, 256K context, vision+tools. Daily driver for interactive use since 2026-08-12. Slot 1: same correctness as qwen2.5:7b at 1.4-3x the wall clock; better published benchmarks (AA Intelligence Index 11 vs ~8 median for its size)."
  - model: deepseek-r1:8b
    tokens_per_sec: 18.85
    wall_clock_s: 164.6
    note: "Chain-of-thought inflates total time massively for simple tasks."

